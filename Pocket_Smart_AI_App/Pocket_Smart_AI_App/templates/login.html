{% extends "base.html" %}

{% block content %}

<main class="container">

    <div class="card form">

        <h1>
            Login
        </h1>

        <form
            id="auth-form"
            data-mode="login"
        >

            <div class="field">

                <label>
                    Email
                </label>

                <input
                    name="email"
                    type="email"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    name="password"
                    type="password"
                    required
                >

            </div>


            <button
                class="btn"
                type="submit"
            >
                Login
            </button>

        </form>


        <p id="msg"></p>


        <p>

            New user?

            <a href="/register">
                Register
            </a>

        </p>

    </div>

</main>


<script src="/static/js/app.js"></script>

<script src="/static/js/auth.js"></script>

{% endblock %}
